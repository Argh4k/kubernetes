kind: Pod
metadata:
  generateName: pod-
spec:
  terminationGracePeriodSeconds: 0
  priority: 100
  containers:
  - image: registry.k8s.io/pause:3.10.1
    name: pause
    ports:
    - containerPort: 80
      hostPort: 8080
    resources:
      limits:
        cpu: 100m
        memory: 500Mi
      requests:
        cpu: 100m
        memory: 500Mi