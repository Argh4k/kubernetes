apiVersion: v1
kind: Pod
metadata:
  generateName: pod-low-priority-
spec:
  terminationGracePeriodSeconds: 0
  priority: 100
  containers:
  - image: registry.k8s.io/pause:3.10.1
    name: pause
    ports:
    - containerPort: 80
    resources:
      limits:
        cpu: 1000m
        memory: 500Mi
      requests:
        cpu: 1000m
        memory: 500Mi
