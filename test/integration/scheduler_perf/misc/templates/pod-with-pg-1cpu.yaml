apiVersion: v1
kind: Pod
metadata:
  generateName: pod-high-priority-pg-
spec:
  schedulingGroup:
    podGroupName: pg-{{ Mod .Index .podGroupCount }}
  priority: 1000
  containers:
  - image: registry.k8s.io/pause:3.10.1
    name: pause
    ports:
    - containerPort: 80
    resources:
      limits:
        cpu: 1000m
        memory: 500Mi
      requests:
        cpu: 1000m
        memory: 500Mi
